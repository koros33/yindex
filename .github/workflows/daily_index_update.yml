# .github/workflows/daily-index-update.yml
name: Daily Index Update

on:
  schedule:
    - cron: '0 1 * * 2-6'    # 1:00 AM UTC, Tue-Sat = 4:00 AM EAT
                              # Covers Mon-Fri US closes (data ready ~2hrs after close)
  workflow_dispatch:          # Manual trigger anytime

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Run Daily Index Updater
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          echo "========================================"
          echo "🕒 Starting Daily Update - $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📍 Location: After US Market Close"
          echo "========================================"
          go run cmd/daily-updater/main.go
        shell: bash