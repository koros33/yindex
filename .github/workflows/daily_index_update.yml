name: NSE Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r cmd/daily-updater/requirements.txt

      - name: Run NSE scraper
        run: python cmd/daily-updater/scrape_nse_data.py cmd/daily-updater/nse_dividend_screen.csv

      - name: Show updated CSV
        run: |
          echo "Scraper completed"
          head -5 nse_dividend_screen.csv