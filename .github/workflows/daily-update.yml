name: NSE Dividend Index Daily Update

on:
  schedule:
    # Runs Mon-Fri at 6:00 PM EAT (15:00 UTC)
    # NSE closes at 3:00 PM EAT, gives 3hrs for prices to settle
    - cron: '0 15 * * 1-5'
  workflow_dispatch: # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build daily updater
        run: go build -o updater ./cmd/daily-updater/main.go

      - name: Run daily updater
        continue-on-error: true
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: |
         for i in 1 2 3; do
          echo "Attempt $i..."
          ./updater && break
          echo "Attempt $i failed, waiting 30s..."
          sleep 30
         done